name: isar_generator
description: Code generator for the Isar Database. Finds classes annotated with @Collection.
version: 3.1.0+1
repository: https://github.com/isar/isar
homepage: https://isar.dev
publish_to: none

environment:
  sdk: "^3.7.0"

dependencies:
  analyzer: "^9.0.0"
  build: ^4.0.3
  dart_style: ^3.1.3
  dartx: ^1.1.0
  glob: ^2.0.2
  isar:
    git:
      url: https://github.com/posbankbh/isar.git
      path: "packages/isar"
      ref: test
  path: ^1.8.1
  source_gen: ^4.1.1
  xxh3: ^1.0.1
  yaml: ^3.0.0


dev_dependencies:
  build_test: ^3.5.4
  matcher: ^0.12.12
  test: ^1.21.0
  very_good_analysis: ^10.0.0
